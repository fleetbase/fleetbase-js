name: Publish npm release

on:
    push:
        tags: ['v*']
    workflow_dispatch:

concurrency:
    group: npm-release-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    publish:
        if: startsWith(github.ref, 'refs/tags/v') && vars.NPM_PUBLISH_ENABLED == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 25
        environment: npm
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: pnpm/action-setup@v4
              with:
                  run_install: false
            - uses: actions/setup-node@v4
              with:
                  node-version: 24.15.0
                  cache: pnpm
                  registry-url: https://registry.npmjs.org
            - name: Validate tag and reviewed release metadata
              run: |
                  git merge-base --is-ancestor HEAD origin/main
                  node scripts/validate-release.mjs "$GITHUB_REF_NAME"
            - run: pnpm install --frozen-lockfile
            - run: pnpm run verify
            - name: Publish exact tarball with provenance
              run: pnpm run publish:ci
            - name: Verify registry checksum and clean consumers
              run: node scripts/verify-published.mjs
            - name: Preserve release evidence
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: npm-release-${{ github.sha }}
                  path: artifacts/
                  if-no-files-found: warn
                  retention-days: 90
            - name: Create release or attach verified evidence
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
                      gh release upload "$GITHUB_REF_NAME" artifacts/*.tgz artifacts/SHA256SUMS --clobber
                  else
                      extra=()
                      if [[ "$GITHUB_REF_NAME" == *-* ]]; then extra+=(--prerelease); fi
                      gh release create "$GITHUB_REF_NAME" artifacts/*.tgz artifacts/SHA256SUMS --verify-tag --notes-file RELEASE.md --title "$GITHUB_REF_NAME" "${extra[@]}"
                  fi
