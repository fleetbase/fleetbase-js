name: Mutation quality

on:
    workflow_dispatch:
    schedule:
        - cron: '41 4 * * 0'

concurrency:
    group: mutation-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    mutation:
        name: Stryker / core behavior
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  run_install: false
            - uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm run test:mutation
            - name: Upload mutation report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: mutation-report-${{ github.sha }}
                  path: reports/mutation
                  if-no-files-found: warn
                  retention-days: 30
