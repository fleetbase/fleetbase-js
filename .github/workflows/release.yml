name: Release

on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: release
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    select-mode:
        name: Select release mode
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        outputs:
            mode: ${{ steps.select-mode.outputs.mode }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@v4
              with:
                  run_install: false
            - uses: actions/setup-node@v4
              with:
                  node-version: 24.x
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Select version, publish, or no-op
              id: select-mode
              uses: changesets/action/select-mode@v2

    version:
        name: Create or update release PR
        if: needs.select-mode.outputs.mode == 'version'
        needs: select-mode
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
            pull-requests: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@v4
              with:
                  run_install: false
            - uses: actions/setup-node@v4
              with:
                  node-version: 24.x
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Create reviewed version pull request
              uses: changesets/action/version@v2
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: pnpm run version-packages
                  commit-message: 'chore: release packages'
                  pr-title: 'chore: release packages'

    publish:
        name: Publish reviewed version
        if: needs.select-mode.outputs.mode == 'publish'
        needs: select-mode
        runs-on: ubuntu-latest
        timeout-minutes: 20
        environment: npm
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@v4
              with:
                  run_install: false
            - uses: actions/setup-node@v4
              with:
                  node-version: 24.x
                  cache: pnpm
                  registry-url: https://registry.npmjs.org
            - run: pnpm install --frozen-lockfile
            - run: pnpm run verify
            - name: Publish immutable candidate with provenance
              run: pnpm run publish:ci
              env:
                  NPM_CONFIG_PROVENANCE: true
            - name: Verify exact registry artifact
              run: node scripts/verify-published.mjs
            - name: Upload immutable release evidence
              uses: actions/upload-artifact@v4
              with:
                  name: npm-release-${{ github.sha }}
                  path: |
                      artifacts/*.tgz
                      artifacts/SHA256SUMS
                  if-no-files-found: error
                  retention-days: 90
            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  version=$(node -p "require('./package.json').version")
                  tag="v${version}"
                  if gh release view "$tag" >/dev/null 2>&1; then
                      echo "GitHub release $tag already exists."
                  else
                      gh release create "$tag" artifacts/*.tgz artifacts/SHA256SUMS --generate-notes --target "$GITHUB_SHA" --title "$tag"
                  fi
