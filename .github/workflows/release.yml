name: Release SDK

on:
    pull_request:
        types: [closed]
        branches: [main]
    workflow_dispatch:
        inputs:
            version:
                description: 'Recovery only: version to release from main, e.g. 2.0.0'
                required: true
                type: string
            github_packages_only:
                description: 'Mirror an existing release to GitHub Packages only; never tag or publish to npm'
                type: boolean
                default: false

# Avoid concurrent publication attempts.
concurrency:
    group: sdk-release
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    release:
        name: Tag, publish SDK, and create release
        if: >-
            (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.github_packages_only) ||
            (github.event.pull_request.merged == true &&
             (startsWith(github.event.pull_request.head.ref, 'release/v') ||
              startsWith(github.event.pull_request.head.ref, 'dev-v')))
        runs-on: ubuntu-latest
        timeout-minutes: 25
        permissions:
            contents: write
            id-token: write
        outputs:
            tag: ${{ steps.metadata.outputs.tag }}
        env:
            RELEASE_BRANCH: ${{ github.event.pull_request.head.ref || format('release/v{0}', inputs.version) }}
        steps:
            - name: Check npm publishing credential
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
              run: |
                  if [[ -z "$NODE_AUTH_TOKEN" ]]; then
                      echo "::error::NPM_AUTH_TOKEN must be available to this repository and authorized to publish @fleetbase/sdk."
                      exit 1
                  fi
            - uses: actions/checkout@v7
              with:
                  # Never tag whatever main happens to point at when the job starts.
                  ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
                  fetch-depth: 0
                  persist-credentials: false
            - uses: pnpm/action-setup@v6
              with:
                  run_install: false
            - uses: actions/setup-node@v7
              with:
                  node-version: 24.15.0
                  cache: pnpm
                  registry-url: https://registry.npmjs.org
            - name: Validate reviewed commit and release metadata
              id: metadata
              run: |
                  git merge-base --is-ancestor HEAD origin/main
                  tag=$(node scripts/release-tag.mjs "$RELEASE_BRANCH" --name-only)
                  node scripts/validate-release.mjs "$tag"
                  echo "tag=$tag" >> "$GITHUB_OUTPUT"
            - run: pnpm install --frozen-lockfile
            - run: pnpm run verify
            - name: Tag the exact reviewed commit
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh auth setup-git
                  node scripts/release-tag.mjs "$RELEASE_BRANCH"
            # Continue directly: tags pushed by GITHUB_TOKEN do not trigger other workflows.
            - name: Publish SDK with provenance
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
              run: pnpm run publish:ci
            - name: Verify registry checksum and clean consumers
              run: node scripts/verify-published.mjs
            - name: Preserve release evidence
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: npm-release-${{ github.sha }}
                  path: artifacts/
                  if-no-files-found: warn
                  retention-days: 90
            - name: Create GitHub release or attach verified evidence
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
              run: |
                  if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
                      gh release upload "$RELEASE_TAG" artifacts/*.tgz artifacts/SHA256SUMS --clobber
                  else
                      extra=()
                      if [[ "$RELEASE_TAG" == *-* ]]; then extra+=(--prerelease); fi
                      gh release create "$RELEASE_TAG" artifacts/*.tgz artifacts/SHA256SUMS --verify-tag --notes-file RELEASE.md --title "$RELEASE_TAG" "${extra[@]}"
                  fi

    github_packages:
        name: Publish verified release to GitHub Packages
        needs: release
        if: >-
            always() &&
            (needs.release.result == 'success' ||
             (github.event_name == 'workflow_dispatch' && inputs.github_packages_only))
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            packages: write
        env:
            RELEASE_TAG: ${{ needs.release.outputs.tag || format('v{0}', inputs.version) }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@v7
              with:
                  node-version: 24.15.0
                  registry-url: https://npm.pkg.github.com
                  scope: '@fleetbase'
            - name: Download the existing release artifact without rebuilding
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
                  git merge-base --is-ancestor "$RELEASE_TAG^{commit}" origin/main
                  gh release download "$RELEASE_TAG" --pattern '*.tgz' --pattern SHA256SUMS --dir artifacts
            - name: Publish identical bytes and verify GitHub Packages
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: node scripts/publish-github.mjs "$RELEASE_TAG"
            - name: Report GitHub package location and visibility
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh api /orgs/fleetbase/packages/npm/sdk --jq '{name, visibility, html_url, repository: .repository.full_name}'
