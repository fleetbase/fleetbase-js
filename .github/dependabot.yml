version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 10
      groups:
          development-tooling:
              dependency-type: development
              update-types: [minor, patch]
      commit-message:
          prefix: 'chore(deps)'
      labels: [dependencies]

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
      groups:
          actions:
              patterns: ['*']
      commit-message:
          prefix: 'chore(ci)'
      labels: [dependencies]
